<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; overflow:hidden; font-family:sans-serif; }
#c { display:block; width:100vw; height:100vh; }
#info {
  position:absolute; z-index:10; top:10px; left:50%; transform:translateX(-50%);
  color:#ccd; font:14px/1.6 sans-serif; text-align:center;
  pointer-events:none; text-shadow:0 1px 3px #000;
  white-space:nowrap;
}
#panel {
  display:none; position:absolute; z-index:10; top:12px; right:12px;
  background:rgba(15,15,30,0.92); border:1px solid #334;
  border-radius:10px; padding:10px; color:#dde;
  box-shadow:0 4px 18px rgba(0,0,0,0.6);
  pointer-events:none;
  /* adaptive width: 30% of viewport, clamped between 160px and 380px */
  width: clamp(160px, 30vmin, 380px);
}
#fc { display:block; width:100%; aspect-ratio:1; border-radius:4px; }
#pname {
  text-align:center; margin-top:6px; font-size:clamp(13px, 1.6vmin, 20px);
  font-weight:bold; letter-spacing:0.05em; color:#8cf;
}
#phint { text-align:center; font-size:clamp(9px, 1.1vmin, 13px); color:#667; margin-top:2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">
  __TITLE__<br>
  <small>Left-drag: rotate &nbsp;|&nbsp; Right-drag: pan &nbsp;|&nbsp; Scroll: zoom &nbsp;|&nbsp; Hover: inspect piece</small>
</div>
<div id="panel">
  <canvas id="fc"></canvas>
  <div id="pname"></div>
  <div id="phint">flat layout</div>
</div>

<script>
'use strict';

// ── Geometry data (inlined by Papercraft exporter) ───────────────────────
// VERTS  stride=7 floats: [x3d, y3d, z3d, r, g, b, island_f]
const VERTS   = new Float32Array(__VERTS__);
// EDGES  stride=3 floats/endpoint: [x3d, y3d, z3d, x3d, y3d, z3d, ...]
const EDGES   = new Float32Array(__EDGES__);
// ISLANDS: [{name:str, flat:[x0,y0, x1,y1, x2,y2, r,g,b, ...]}]
//   flat = 9 floats per triangle (3× xy coords + rgb face colour)
const ISLANDS = __ISLANDS__;

// ── WebGL context ────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', {antialias:true});
if (!gl) {
  document.body.innerHTML = '<p style="color:red;padding:2em;font-size:1.4em">WebGL not supported in this browser.</p>';
  throw 0;
}
const extDeriv = gl.getExtension('OES_standard_derivatives');

// ── Shaders ───────────────────────────────────────────────────────────────
const VS_MESH = `
attribute vec3 aPos;
attribute vec3 aCol;
attribute float aIsl;
uniform mat4 uMVP;
uniform mat4 uMdl;
uniform float uHover;
varying vec3 vWP;
varying vec3 vCol;
void main() {
  vec4 wp = uMdl * vec4(aPos, 1.0);
  vWP = wp.xyz;
  float h = 1.0 - step(0.5, abs(aIsl - uHover));
  vCol = mix(aCol, aCol + vec3(0.28, 0.28, 0.06), h);
  gl_Position = uMVP * vec4(aPos, 1.0);
}`;

const FS_MESH_D = `
#extension GL_OES_standard_derivatives : enable
precision mediump float;
varying vec3 vWP;
varying vec3 vCol;
void main() {
  vec3 raw = cross(dFdx(vWP), dFdy(vWP));
  float len = length(raw);
  // abs(dot) = two-sided lighting: front AND back faces are lit, never black.
  // Guard against degenerate (zero-area) triangles with len check.
  vec3 N = (len > 1e-10) ? raw / len : vec3(0.0, 0.0, 1.0);
  float d = abs(dot(N, normalize(vec3(1.0, 2.0, 2.0)))) * 0.65
           + abs(dot(N, normalize(vec3(-1.0, -0.5, 0.8)))) * 0.20
           + 0.15;
  gl_FragColor = vec4(clamp(vCol * d, 0.0, 1.0), 1.0);
}`;

const FS_MESH_F = `
precision mediump float;
varying vec3 vCol;
void main() { gl_FragColor = vec4(vCol, 1.0); }`;

const VS_EDGE = `
attribute vec3 aPos;
uniform mat4 uMVP;
void main() { gl_Position = uMVP * vec4(aPos, 1.0); }`;

const FS_EDGE = `
precision mediump float;
void main() { gl_FragColor = vec4(0.15, 0.55, 1.0, 1.0); }`;

function mkShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw 'Shader error: ' + gl.getShaderInfoLog(s);
  return s;
}
function mkProg(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, mkShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, mkShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw 'Link error: ' + gl.getProgramInfoLog(p);
  return p;
}

const meshProg = mkProg(VS_MESH, extDeriv ? FS_MESH_D : FS_MESH_F);
const edgeProg = mkProg(VS_EDGE, FS_EDGE);

const M = {
  prog: meshProg,
  aPos: gl.getAttribLocation(meshProg, 'aPos'),
  aCol: gl.getAttribLocation(meshProg, 'aCol'),
  aIsl: gl.getAttribLocation(meshProg, 'aIsl'),
  uMVP: gl.getUniformLocation(meshProg, 'uMVP'),
  uMdl: gl.getUniformLocation(meshProg, 'uMdl'),
  uHov: gl.getUniformLocation(meshProg, 'uHover'),
};
const E = {
  prog: edgeProg,
  aPos: gl.getAttribLocation(edgeProg, 'aPos'),
  uMVP: gl.getUniformLocation(edgeProg, 'uMVP'),
};

// ── GPU Buffers ───────────────────────────────────────────────────────────
const meshBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, meshBuf);
gl.bufferData(gl.ARRAY_BUFFER, VERTS, gl.STATIC_DRAW);

const edgeBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, edgeBuf);
gl.bufferData(gl.ARRAY_BUFFER, EDGES, gl.STATIC_DRAW);

const VSTRIDE = 28; // 7 floats × 4 bytes

// ── Math helpers ──────────────────────────────────────────────────────────
function m4mul(a, b) {
  const o = new Float32Array(16);
  for (let r = 0; r < 4; r++)
    for (let c = 0; c < 4; c++)
      for (let k = 0; k < 4; k++)
        o[c*4+r] += a[k*4+r] * b[c*4+k];
  return o;
}
function m4id() { const m = new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
function m4persp(fovy, asp, near, far) {
  const f = 1/Math.tan(fovy/2), nf = 1/(near-far), m = new Float32Array(16);
  m[0]=f/asp; m[5]=f; m[10]=(far+near)*nf; m[11]=-1; m[14]=2*far*near*nf;
  return m;
}
function m4trans(x,y,z) { const m=m4id(); m[12]=x; m[13]=y; m[14]=z; return m; }
function m4rotX(a) {
  const m=m4id(), c=Math.cos(a), s=Math.sin(a);
  m[5]=c; m[6]=s; m[9]=-s; m[10]=c; return m;
}
function m4rotY(a) {
  const m=m4id(), c=Math.cos(a), s=Math.sin(a);
  m[0]=c; m[2]=-s; m[8]=s; m[10]=c; return m;
}

// ── Camera state ──────────────────────────────────────────────────────────
let rotX=0.3, rotY=0.5, zoom=3.0, panX=0, panY=0;
let hovIsl = -1;

// ── Ray-triangle intersection (Möller–Trumbore) ──────────────────────────
// Returns the island index hit by a ray from screen pixel (mx,my),
// or -1 if no triangle is hit.
function raycast(mx, my) {
  const W = canvas.width, H = canvas.height;
  const nx = (mx/W)*2 - 1;
  const ny = 1 - (my/H)*2;

  // Rotation matrix (column-major Float32Array)
  const rot = m4mul(m4rotX(rotX), m4rotY(rotY));
  // r[c*4+r] = rotation M at row r, col c

  // tan(fov/2) for fov = π/4
  const thf = Math.tan(Math.PI/8);
  const asp = W/H;

  // Ray direction in eye space
  const rex = nx * asp * thf;
  const rey = ny * thf;
  const rez = -1.0;

  // Transform ray direction to model space: rdModel = rot^T * ray_eye
  // rot^T applied to v: result_i = sum_j rot[i*4+j]*v_j  (column→row swap)
  const rdx = rot[0]*rex + rot[1]*rey + rot[2]*rez;
  const rdy = rot[4]*rex + rot[5]*rey + rot[6]*rez;
  const rdz = rot[8]*rex + rot[9]*rey + rot[10]*rez;

  // Camera origin in model space: rot^T * (-panX, -panY, zoom)
  const rox = rot[0]*(-panX) + rot[1]*(-panY) + rot[2]*zoom;
  const roy = rot[4]*(-panX) + rot[5]*(-panY) + rot[6]*zoom;
  const roz = rot[8]*(-panX) + rot[9]*(-panY) + rot[10]*zoom;

  let bestT = Infinity, bestIsl = -1;
  const EPS = 1e-6;

  for (let i = 0; i < VERTS.length; i += 21) { // 7×3 = 21 floats per triangle
    const ax=VERTS[i],   ay=VERTS[i+1],  az=VERTS[i+2];
    const bx=VERTS[i+7], by=VERTS[i+8],  bz=VERTS[i+9];
    const cx=VERTS[i+14],cy=VERTS[i+15], cz=VERTS[i+16];
    const isl = Math.round(VERTS[i+6]);

    const e1x=bx-ax, e1y=by-ay, e1z=bz-az;
    const e2x=cx-ax, e2y=cy-ay, e2z=cz-az;

    // h = rd × e2
    const hx=rdy*e2z-rdz*e2y, hy=rdz*e2x-rdx*e2z, hz=rdx*e2y-rdy*e2x;
    const det = e1x*hx + e1y*hy + e1z*hz;
    if (Math.abs(det) < EPS) continue;
    const inv = 1/det;

    const sx=rox-ax, sy=roy-ay, sz=roz-az;
    const u = (sx*hx + sy*hy + sz*hz) * inv;
    if (u < 0 || u > 1) continue;

    const qx=sy*e1z-sz*e1y, qy=sz*e1x-sx*e1z, qz=sx*e1y-sy*e1x;
    const v = (rdx*qx + rdy*qy + rdz*qz) * inv;
    if (v < 0 || u+v > 1) continue;

    const t = (e2x*qx + e2y*qy + e2z*qz) * inv;
    if (t > EPS && t < bestT) { bestT=t; bestIsl=isl; }
  }
  return bestIsl;
}

// ── 2D flat panel ─────────────────────────────────────────────────────────
const panel  = document.getElementById('panel');
const fc     = document.getElementById('fc');
const pname  = document.getElementById('pname');
const fctx = fc.getContext('2d');

function showPanel(idx) {
  if (idx < 0 || idx >= ISLANDS.length) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = 'block';
  pname.textContent = ISLANDS[idx].name || '?';

  // Size the canvas to its CSS rendered size (adapts to viewport via clamp)
  const cssW = fc.getBoundingClientRect().width;
  const dpr  = window.devicePixelRatio || 1;
  const FW   = Math.round(cssW * dpr);
  const FH   = FW; // square
  fc.width   = FW;
  fc.height  = FH;
  const FM   = Math.round(FW * 0.06); // 6% margin

  fctx.clearRect(0, 0, FW, FH);
  fctx.fillStyle = '#111320';
  fctx.fillRect(0, 0, FW, FH);

  const flat = ISLANDS[idx].flat; // [x0,y0, x1,y1, x2,y2, r,g,b, ...]
  if (!flat.length) return;

  // Bounding box of all 2D vertices in this island
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (let i = 0; i < flat.length; i += 9) {
    for (let v = 0; v < 3; v++) {
      const x = flat[i + v*2], y = flat[i + v*2 + 1];
      if (x < minX) minX=x; if (x > maxX) maxX=x;
      if (y < minY) minY=y; if (y > maxY) maxY=y;
    }
  }
  const spanX = maxX-minX || 1, spanY = maxY-minY || 1;
  const sc = Math.min((FW-2*FM)/spanX, (FH-2*FM)/spanY);
  const ox = FM + ((FW-2*FM) - spanX*sc)/2 - minX*sc;
  const oy = FM + ((FH-2*FM) - spanY*sc)/2 - minY*sc;

  // 1. Draw filled triangles
  for (let i = 0; i < flat.length; i += 9) {
    const x0=flat[i  ]*sc+ox, y0=flat[i+1]*sc+oy;
    const x1=flat[i+2]*sc+ox, y1=flat[i+3]*sc+oy;
    const x2=flat[i+4]*sc+ox, y2=flat[i+5]*sc+oy;
    const ri=Math.round(flat[i+6]*255), gi=Math.round(flat[i+7]*255), bi=Math.round(flat[i+8]*255);
    fctx.beginPath();
    fctx.moveTo(x0,y0); fctx.lineTo(x1,y1); fctx.lineTo(x2,y2); fctx.closePath();
    fctx.fillStyle = `rgb(${ri},${gi},${bi})`;
    fctx.fill();
  }

  // 2. Draw edges: thin black on light faces, thin white on dark faces
  fctx.lineWidth = Math.max(0.5, FW / 400); // ~1px at 400px canvas, scales with size
  fctx.lineJoin = 'round';
  for (let i = 0; i < flat.length; i += 9) {
    const x0=flat[i  ]*sc+ox, y0=flat[i+1]*sc+oy;
    const x1=flat[i+2]*sc+ox, y1=flat[i+3]*sc+oy;
    const x2=flat[i+4]*sc+ox, y2=flat[i+5]*sc+oy;
    // Perceived luminance of this face
    const lum = flat[i+6]*0.299 + flat[i+7]*0.587 + flat[i+8]*0.114;
    fctx.strokeStyle = lum < 0.45 ? 'rgba(255,255,255,0.70)' : 'rgba(0,0,0,0.70)';
    fctx.beginPath();
    fctx.moveTo(x0,y0); fctx.lineTo(x1,y1); fctx.lineTo(x2,y2); fctx.closePath();
    fctx.stroke();
  }
}

// ── Input ─────────────────────────────────────────────────────────────────
let drag=null, touches=null;
canvas.addEventListener('contextmenu', e=>e.preventDefault());

canvas.addEventListener('mousedown', e=>{
  drag = {type: (e.button===2||e.button===1)?'pan':'rot', x:e.clientX, y:e.clientY};
});
window.addEventListener('mouseup', ()=>{ drag=null; });

window.addEventListener('mousemove', e=>{
  if (drag) {
    const dx=(e.clientX-drag.x)*0.005, dy=(e.clientY-drag.y)*0.005;
    if (drag.type==='rot') { rotY+=dx; rotX+=dy; }
    else { panX+=dx*zoom*0.5; panY-=dy*zoom*0.5; }
    drag.x=e.clientX; drag.y=e.clientY;
    requestAnimationFrame(draw);
    return;
  }
  // Hover detection
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left)*dpr;
  const my = (e.clientY - rect.top)*dpr;
  const hit = raycast(mx, my);
  if (hit !== hovIsl) {
    hovIsl = hit;
    showPanel(hit);
    requestAnimationFrame(draw);
  }
});

canvas.addEventListener('wheel', e=>{
  zoom *= Math.exp(e.deltaY*0.001);
  zoom = Math.max(0.1, Math.min(zoom, 200));
  requestAnimationFrame(draw);
  e.preventDefault();
}, {passive:false});

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  if (e.touches.length===1)
    drag = {type:'rot', x:e.touches[0].clientX, y:e.touches[0].clientY};
  else if (e.touches.length===2) {
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    touches = {dist:Math.hypot(dx,dy)};
  }
}, {passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if (e.touches.length===1 && drag) {
    const dx=(e.touches[0].clientX-drag.x)*0.005;
    const dy=(e.touches[0].clientY-drag.y)*0.005;
    rotY+=dx; rotX+=dy;
    drag.x=e.touches[0].clientX; drag.y=e.touches[0].clientY;
    requestAnimationFrame(draw);
  } else if (e.touches.length===2 && touches) {
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.hypot(dx,dy);
    zoom *= touches.dist/d;
    zoom = Math.max(0.1, Math.min(zoom, 200));
    touches.dist=d;
    requestAnimationFrame(draw);
  }
}, {passive:false});
canvas.addEventListener('touchend', ()=>{ drag=null; touches=null; });

// ── Render ────────────────────────────────────────────────────────────────
function resize() {
  const dpr = window.devicePixelRatio||1;
  canvas.width  = Math.round(canvas.clientWidth  * dpr);
  canvas.height = Math.round(canvas.clientHeight * dpr);
}

function draw() {
  resize();
  const W=canvas.width, H=canvas.height;
  gl.viewport(0,0,W,H);
  gl.clearColor(0.1, 0.1, 0.18, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);

  const asp  = W/H;
  const proj = m4persp(Math.PI/4, asp, 0.01, 1000);
  const rot  = m4mul(m4rotX(rotX), m4rotY(rotY));
  const view = m4trans(panX, panY, -zoom);
  const mvp  = m4mul(proj, m4mul(view, rot));

  // --- Mesh ---
  gl.useProgram(M.prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, meshBuf);
  gl.enableVertexAttribArray(M.aPos); gl.vertexAttribPointer(M.aPos, 3, gl.FLOAT, false, VSTRIDE,  0);
  gl.enableVertexAttribArray(M.aCol); gl.vertexAttribPointer(M.aCol, 3, gl.FLOAT, false, VSTRIDE, 12);
  gl.enableVertexAttribArray(M.aIsl); gl.vertexAttribPointer(M.aIsl, 1, gl.FLOAT, false, VSTRIDE, 24);
  gl.uniformMatrix4fv(M.uMVP, false, mvp);
  gl.uniformMatrix4fv(M.uMdl, false, rot);
  gl.uniform1f(M.uHov, hovIsl);
  gl.drawArrays(gl.TRIANGLES, 0, VERTS.length/7);

  // --- Cut edges (drawn slightly in front to avoid z-fighting) ---
  if (EDGES.length > 0) {
    gl.useProgram(E.prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, edgeBuf);
    gl.enableVertexAttribArray(E.aPos); gl.vertexAttribPointer(E.aPos, 3, gl.FLOAT, false, 12, 0);
    gl.uniformMatrix4fv(E.uMVP, false, mvp);
    gl.drawArrays(gl.LINES, 0, EDGES.length/3);
  }
}

draw();
window.addEventListener('resize', ()=>requestAnimationFrame(draw));
</script>
</body>
</html>
